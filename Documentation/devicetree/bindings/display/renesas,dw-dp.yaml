%YAML 1.2
---
$id: http://devicetree.org/schemas/display/renesas,dw-dp.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Renesas R-Car DesignWare DisplayPort TX

maintainers:
  TBD

description:
  The DT bindings describes the DisplayPort TX (DP-TX) embedded in
  the Renesas R-Car Gen5 SoC.

properties:
  compatible:
    enum:
      - renesas,r8a78000-dw-dp     # R-Car X5H

  reg:
    items:
      - description: DP-TX registers
      - description: Firmware memory
      - description: PHY registers

  reg-names:
    items:
      - const: io_base
      - const: fw
      - const: phy

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  power-domains:
    minItems: 1
    maxItems: 2

  ports:
    $ref: /schemas/graph.yaml#/properties/ports
    description:
      The input connections from the VCON, one port per stream.

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - clocks
  - power-domains
  - ports

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    dp@c5400000 {
        compatible = "renesas,r8a78000-dw-dp";
        reg = <0xc5400000 0x60000>,
              <0xc5460000 0x20000>,
              <0xc5480000 0x80000>;
        reg-names = "io_base", "fw", "phy";
        interrupts = <GIC_SPI 4309 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&scmi_clk 0>;
        resets = <&scmi_reset 0>;
        power-domains = <&scmi_devpd 0>, <&scmi_devpd 1>;

        ports {
            #address-cells = <1>;
            #size-cells = <0>;

            port@0 {
                reg = <0>;
                dw_dp0_0_in: endpoint {
                    remote-endpoint = <&vcon_out_dp0_0>;
                };
            };
        };
    };
