%YAML 1.2
---
$id: http://devicetree.org/schemas/display/bridge/ti,tdp2004.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Texas Instruments TDP2004 DisplayPort Redriver

maintainers:
  - TBD

description:
  The TDP2004 is an I2C-controlled DisplayPort 1.2 linear redriver used to
  recondition the high-speed lanes between a DisplayPort source and connector.

properties:
  compatible:
    const: ti,tdp2004

  reg:
    maxItems: 1

  enable-gpios:
    maxItems: 1
    description: GPIO connected to the device enable pin.

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        redriver@18 {
            compatible = "ti,tdp2004";
            reg = <0x18>;
            enable-gpios = <&gpio9 14 GPIO_ACTIVE_LOW>;
        };
    };
