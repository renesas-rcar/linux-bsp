%YAML 1.2
---
$id: http://devicetree.org/schemas/ufs/renesas,rcar-gen5-ufs.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Renesas R-Car UFS Host Controller for R-Car Gen5

maintainers:
  - Yoshihiro Shimoda <yoshihiro.shimoda.uh@renesas.com>

allOf:
  - $ref: ufs-common.yaml

properties:
  compatible:
    items:
      - enum:
          - renesas,r8a78000-ufs     # R-Car X5H
      - const: renesas,rcar-gen5-ufs

  reg:
    maxItems: 2

  reg-names:
    items:
      - const: phy
      - const: hcr

  clocks:
    maxItems: 1

  clock-names:
    items:
      - const: ref_clk

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    ufs0: ufs@c0a80000 {
        compatible = "renesas,r8a78000-ufs", "renesas,rcar-gen5-ufs";
        reg = <0xc0a80000 0x1100>, <0xc0a00000, 0x40000>;
        reg-names = "hcr", "phy";
        interrupts = <GIC_SPI 4284 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&ufs40_clk>;
        clock-names = "ref_clk";
        freq-table-hz = <200000000 200000000>, <38400000 38400000>;
    };
