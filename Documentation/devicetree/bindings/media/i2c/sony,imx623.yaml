%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/sony,imx623.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sony IMX623 CMOS Image Sensor

maintainers:
  - Linh Phung <linh.phung.jy@renesas.com>

description: |
  The Sony IMX623 is a CMOS image sensor connected via a Maxim GMSL2
  serializer/deserializer link (e.g. MAX96717/MAX96712/MAX96726) rather than
  directly to the SoC's CSI-2 receiver.

  This binding only describes the devicetree node's compatible/reg/port, as
  used by the boards in this repository. The v4l2 subdev driver that binds
  this compatible is not part of this kernel tree: it is maintained
  out-of-tree in the "gmsl_serdes" project, built and installed as a
  separate kernel module alongside the deserializer driver.

properties:
  compatible:
    const: sony,imx623

  reg:
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    unevaluatedProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

    required:
      - endpoint

required:
  - compatible
  - reg
  - port

additionalProperties: false

examples:
  - |
    camera@59 {
        compatible = "sony,imx623";
        reg = <0x59>;

        port {
            endpoint {
                remote-endpoint = <&max96726_in2>;
            };
        };
    };
