%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/renesas/renesas,rcar-gen5-kcrc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Renesas R-Car Gen5 KCRC (Cyclic Redundancy Check) Controller

maintainers:
  - Huy Bui <huy.bui.wm@renesas.com>

properties:
  compatible:
    const: renesas,rcar-gen5-kcrc

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    items:
      - const: fck

required:
  - compatible
  - reg
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    kcrc0: kcrc@19100000 {
        compatible = "renesas,rcar-gen5-kcrc";
        reg = <0x19100000 0x00010000>;
        clocks = <&cpg_clk 0>;
        clock-names = "fck";
    };
