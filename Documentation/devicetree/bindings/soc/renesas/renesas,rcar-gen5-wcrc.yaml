%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/renesas/renesas,rcar-gen5-wcrc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Renesas R-Car Gen5 WCRC (CRC Wrapper) Controller

maintainers:
  - Huy Bui <huy.bui.wm@renesas.com>

description:
  The WCRC wraps a pair of CRC and KCRC sub-modules and drives data
  to/from them through DMA, in addition to direct register access.

properties:
  compatible:
    const: renesas,rcar-gen5-wcrc

  reg:
    items:
      - description: WCRC register region
      - description: FIFO register region

  reg-names:
    items:
      - const: wcrc
      - const: fifo

  sub-crc:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: phandle to the CRC sub-module used by this WCRC instance.

  sub-kcrc:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: phandle to the KCRC sub-module used by this WCRC instance.

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    items:
      - const: fck

  dmas:
    minItems: 8
    maxItems: 32

  dma-names:
    minItems: 8
    maxItems: 32

required:
  - compatible
  - reg
  - reg-names
  - sub-crc
  - sub-kcrc
  - interrupts
  - clocks
  - clock-names
  - dmas
  - dma-names

additionalProperties: false

examples:
  - |
    wcrc0: wcrc@19200000 {
        compatible = "renesas,rcar-gen5-wcrc";
        reg = <0x19200000 0x00010000>,
              <0x19400000 0x4000>;
        reg-names = "wcrc", "fifo";
        sub-crc = <&crc0>;
        sub-kcrc = <&kcrc0>;
        interrupts = <0x00 0x106f 0x04>;
        clocks = <&cpg_clk 0>;
        clock-names = "fck";
        dmas = <&rt_dmac0 0x18>, <&rt_dmac0 0x19>,
               <&rt_dmac0 0x1a>, <&rt_dmac0 0x1b>,
               <&rt_dmac0 0x1c>, <&rt_dmac0 0x1d>,
               <&rt_dmac0 0x1e>, <&rt_dmac0 0x1f>;
        dma-names = "crc_rx", "crc_tx", "crc_rx_in", "crc_txrx",
                    "kcrc_rx", "kcrc_tx", "kcrc_rx_in", "kcrc_txrx";
    };
